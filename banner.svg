<text x="488" y="186" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" xml:space="preserve" style="white-space:pre"><tspan fill="#0A7EA4">openTo</tspan><tspan fill="#57606A">: </tspan><tspan fill="#B35900">"Frontend roles"</tspan><tspan fill="#57606A">,</tspan></text>
<text x="472" y="210" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" xml:space="preserve" style="white-space:pre"><tspan fill="#57606A">} </tspan><tspan fill="#8250DF">as const</tspan><tspan fill="#57606A">;</tspan></text>
</g>
<rect x="0.5" y="0.5" width="879" height="279" rx="18" fill="none" stroke="#D0D7E8"/>
