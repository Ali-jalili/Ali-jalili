<text x="48" y="196" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#475569" opacity="0">Looking for my first Frontend role<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.667;0.707;0.97;1" dur="12s" repeatCount="indefinite"/></text>

<rect x="48" y="226" width="196" height="30" rx="15" fill="#DCFCE7" stroke="#86EFAC"/>
<circle cx="68" cy="241" r="4" fill="#16A34A"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
<text x="82" y="245" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#166534">Open to Frontend roles</text>

<rect x="452" y="44" width="380" height="192" rx="14" fill="#FFFFFF" stroke="#D0D7E8"/>
<path d="M452 82H832" stroke="#E2E8F0"/>
<circle cx="472" cy="63" r="5" fill="#FF5F57"/><circle cx="490" cy="63" r="5" fill="#FEBC2E"/><circle cx="508" cy="63" r="5" fill="#28C840"/>
<text x="642" y="67" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#6B7280">profile.ts</text>
