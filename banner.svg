<text x="488" y="138" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" xml:space="preserve" style="white-space:pre"><tspan fill="#0A7EA4">role</tspan><tspan fill="#57606A">: </tspan><tspan fill="#B35900">"Frontend Developer"</tspan><tspan fill="#57606A">,</tspan></text>
