<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280" role="img" aria-label="Ali Jalili, Frontend Developer">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6F8FF"/><stop offset="1" stop-color="#EDE9FF"/></linearGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2F6FEB"/><stop offset="0.55" stop-color="#7C3AED"/><stop offset="1" stop-color="#0891B2"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#0F172A" stroke-opacity="0.05"/></pattern>
<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="46"/></filter>
<clipPath id="clip"><rect width="880" height="280" rx="18"/></clipPath>
</defs>
<g clip-path="url(#clip)">
<rect width="880" height="280" fill="url(#bg)"/>
<rect width="880" height="280" fill="url(#grid)"/>
<circle cx="120" cy="50" r="120" fill="#2F6FEB" opacity="0.3" filter="url(#blur)"><animate attributeName="cx" values="120;260;120" dur="9s" repeatCount="indefinite"/></circle>
<circle cx="760" cy="260" r="130" fill="#7C3AED" opacity="0.28" filter="url(#blur)"><animate attributeName="cy" values="260;190;260" dur="11s" repeatCount="indefinite"/></circle>
<circle cx="520" cy="30" r="80" fill="#22D3EE" opacity="0.18" filter="url(#blur)"><animate attributeName="cx" values="520;640;520" dur="13s" repeatCount="indefinite"/></circle>
<rect width="880" height="3" fill="url(#acc)"/>

