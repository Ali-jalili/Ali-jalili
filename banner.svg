<text x="46" y="140" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="800" fill="#0F172A">Ali <tspan fill="url(#acc)">Jalili</tspan></text>
<rect x="48" y="156" width="56" height="3" rx="1.5" fill="url(#acc)"/>
